<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prova registro ordini</title>
<style>
  :root { --paper: #F4EAD6; --card: #FCF7EC; --ink: #2E2621; --muted: #6E5D4E; --line: #4A3B30; --ok: #2E7D32; --ko: #B4471F; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1C2232; --card: #252C40; --ink: #F2E8D3; --muted: #BDB2A0; --line: #5A6482; --ok: #7FD07A; --ko: #F39A75; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 16px 40px; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  li b { display: block; }
  .ok { color: var(--ok); font-weight: 700; }
  .ko { color: var(--ko); font-weight: 700; }
  .att { color: var(--muted); }
  small { display: block; margin-top: 18px; color: var(--muted); word-break: break-word; }
</style>
</head>
<body>
<main>
  <h1>Prova registro ordini</h1>
  <p>Questa pagina fa da sola quattro prove di invio al foglio degli ordini. Aspetta qualche secondo e poi manda a Claude una foto dello schermo.</p>
  <ul id="prove"></ul>
  <small id="info"></small>
</main>
<script>
(async function () {
  const URL_REG = "/registro-ordini";
  const sigla = Math.random().toString(36).slice(2, 4).toUpperCase().replace(/[^A-Z0-9]/g, "X");
  const $ = id => document.getElementById(id);
  const riga = (id, titolo) => { const li = document.createElement("li"); li.innerHTML = "<b>" + titolo + "</b><span id='" + id + "' class='att'>in corso…</span>"; $("prove").appendChild(li); };
  const esito = (id, ok, testo) => { const el = $(id); el.className = ok ? "ok" : "ko"; el.textContent = (ok ? "✓ " : "✗ ") + testo; };
  const corpo = (lettera, metodo) => JSON.stringify({ azione: "nuovo", canale: "Sito", tipo: "Ordine", codice: "DG" + lettera + sigla, nome: "Diagnostica " + metodo, modalita: "Ritiro", ritiro: "prova", righe: [{ q: 1, nome: "Prova" }], totale: 1, provenienza: "Diagnostica" });

  riga("v", "0 · Versione del sito sul telefono");
  riga("a", "1 · Invio semplice");
  riga("b", "2 · Invio con risposta");
  riga("c", "3 · Invio come il sito");
  riga("d", "4 · Invio di riserva");

  try {
    const html = await (await fetch("/", { cache: "default" })).text();
    const nuova = html.includes('registro: "/registro-ordini"');
    esito("v", nuova, nuova ? "versione nuova" : "versione VECCHIA in memoria");
  } catch (e) { esito("v", false, "non leggibile: " + e.message); }

  try {
    const r = await fetch(URL_REG, { method: "POST", body: corpo("A", "semplice"), redirect: "manual" });
    esito("a", true, "partito (risposta " + (r.type || r.status) + ")");
  } catch (e) { esito("a", false, "bloccato: " + e.message); }

  try {
    const r = await fetch(URL_REG, { method: "POST", body: corpo("B", "con risposta") });
    const t = await r.text();
    esito("b", t.includes('"ok":true'), t.includes('"ok":true') ? "arrivato nel foglio" : "risposta strana: " + t.slice(0, 80));
  } catch (e) { esito("b", false, "bloccato: " + e.message); }

  try {
    await fetch(URL_REG, { method: "POST", body: corpo("C", "come il sito"), mode: "no-cors", keepalive: true });
    esito("c", true, "partito");
  } catch (e) { esito("c", false, "bloccato: " + e.message); }

  try {
    const ok = navigator.sendBeacon && navigator.sendBeacon(URL_REG, new Blob([corpo("D", "riserva")], { type: "text/plain;charset=UTF-8" }));
    esito("d", !!ok, ok ? "accodato" : "rifiutato dal browser");
  } catch (e) { esito("d", false, "bloccato: " + e.message); }

  let brave = false;
  try { brave = !!(navigator.brave && await navigator.brave.isBrave()); } catch (e) { /* niente */ }
  $("info").textContent = "Sigla prova: " + sigla + " · Brave: " + (brave ? "sì" : "no") + " · " + navigator.userAgent;
})();
</script>
</body>
</html>
